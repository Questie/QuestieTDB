name: Release

# Every commit publishes a pre-release; a full release is triggered deliberately. Releases are
# identifiable by content, not just by tag: the manifest carries per-artifact SHA-256, the
# producing commit, the Questie input commit and the contract version.
#
# Publication is impossible on red. `publish` needs both the artifact quality bar and the
# compiler differential. The token-bearing job runs no build code: everything it uploads came
# through those gates, unmodified, via the workflow artifact.
#
# NOTE FOR THE MAINTAINER: this workflow needs secrets that are not configured here.
#   GITHUB_TOKEN    provided automatically; used for the GitHub release
#   CF_API_KEY      CurseForge upload token, if standalone publishing is wanted
# Nothing below attempts to create or guess a credential.

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a full release rather than a pre-release"
        type: boolean
        default: false
      tag:
        description: "Tag for the release (defaults to the short SHA)"
        type: string
        required: false

env:
  SOURCE_DATE_EPOCH: 1700000000

jobs:
  quality:
    name: Quality bar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: QuestieTDB }
      - uses: ./QuestieTDB/.github/actions/checkout-questie

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Materialize the schema
        working-directory: QuestieTDB
        run: lua5.1 generate.lua meta ../Questie

      - name: Fail on schema drift
        working-directory: QuestieTDB
        run: git diff --exit-code src/meta/

      - name: Fail on correction drift
        working-directory: QuestieTDB
        run: |
          lua5.1 tools/port-corrections.lua ../Questie
          git diff --exit-code src/corrections/ src/derived/RamerDouglasPeucker.lua || {
            echo "::error::Ported Corrections or copied libraries differ from Questie's. Review and commit the re-port."
            exit 1
          }

      - name: Generate every flavor
        working-directory: QuestieTDB
        run: lua5.1 generate.lua all --questie=../Questie

      - name: Determinism
        working-directory: QuestieTDB
        # Regenerate before the read gates. The artifacts they approve are therefore the exact
        # second-generation bytes this check proved identical to the first generation.
        run: |
          sha256sum QuestieTDB_{Vanilla,TBC,Wrath,Cata,Mists}.toc > first.sha
          lua5.1 generate.lua all --questie=../Questie --quiet
          sha256sum -c first.sha

      - name: Unit tests
        working-directory: QuestieTDB
        # Defense in depth: the same suite CI runs, here against the artifacts being released.
        run: lua5.1 test.lua

      - name: Reconstruct every artifact
        working-directory: QuestieTDB
        run: lua5.1 reconstruct.lua Vanilla TBC Wrath Cata Mists --questie=../Questie

      - name: Verify every flavor
        working-directory: QuestieTDB
        run: lua5.1 verify.lua

      - name: Verify ownership under freezing
        working-directory: QuestieTDB
        # Match CI's smallest/largest coverage without doubling every flavor's runtime.
        run: lua5.1 verify.lua Vanilla Mists --freeze

      - name: Source/baked equivalence
        working-directory: QuestieTDB
        run: lua5.1 equivalence.lua

      - name: Validate every flavor
        working-directory: QuestieTDB
        run: lua5.1 validators/run.lua

      - name: Golden composed reads
        working-directory: QuestieTDB
        run: |
          for flavor in Vanilla TBC Wrath Cata Mists; do
            python3 tools/differential/golden.py check "$flavor" --lua=lua5.1 --self-check
          done

      - name: Package and write the manifest
        working-directory: QuestieTDB
        run: bash tools/package.sh all

      - name: Hand the packaged release to publish
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: QuestieTDB/.out/dist/*
          retention-days: 7
          if-no-files-found: error

  differential:
    name: Compiler differential (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [Vanilla, TBC, Wrath, Cata, Mists]
    steps:
      - uses: actions/checkout@v4
        with: { path: QuestieTDB }
      - uses: ./QuestieTDB/.github/actions/checkout-questie

      # Questie's compiler oracle needs bit32. Keep this in its own job so the artifact job
      # can continue using the apt-installed interpreter used by the rest of the quality bar.
      - name: Install Lua 5.1
        uses: leafo/gh-actions-lua@v13.0.0
        with:
          luaVersion: "5.1"
      - name: Install luarocks
        uses: leafo/gh-actions-luarocks@v6.1.0
        with:
          luaRocksVersion: "3.13.0"
      - name: Install bit32
        run: luarocks install bit32 5.3.5.1-1

      - name: QuestieTDB vs Questie's compiler
        working-directory: QuestieTDB
        run: >-
          python3 tools/differential/compiler_diff.py ${{ matrix.flavor }}
          --questie=../Questie --lua=lua --self-check

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [quality, differential]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { path: QuestieTDB, fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: QuestieTDB/.out/dist

      - name: Publish
        working-directory: QuestieTDB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="build-$(git rev-parse --short=7 HEAD)"; fi
          PRERELEASE="--prerelease"
          if [ "${{ inputs.release }}" = "true" ]; then PRERELEASE=""; fi
          gh release create "$TAG" .out/dist/* \
            --title "QuestieTDB $TAG" \
            --notes-file .out/dist/RELEASE_NOTES.md \
            $PRERELEASE
